<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AntiCode Logo</title>
  <desc id="desc">A cyberpunk shaka logo for the AntiCode platform.</desc>
  <rect width="256" height="256" rx="48" fill="#030508"/>
  
  <!-- Cyberpunk background glow -->
  <circle cx="128" cy="128" r="80" fill="url(#neon_glow)" opacity="0.35" filter="url(#blur)"/>
  
  <!-- Centered Shaka Emoji -->
  <text x="128" y="152" dominant-baseline="middle" text-anchor="middle" font-size="115" font-family="system-ui, -apple-system, sans-serif">🤙</text>
  
  <!-- Futuristic frame border -->
  <rect x="16" y="16" width="224" height="224" rx="40" stroke="url(#paint1_linear)" stroke-width="4"/>
  
  <!-- Cyberpunk corner accent marks -->
  <path d="M28 16H48" stroke="#00F0FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M16 28V48" stroke="#00F0FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M228 16H208" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/>
  <path d="M240 28V48" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/>
  <path d="M28 240H48" stroke="#00FF66" stroke-width="4" stroke-linecap="round"/>
  <path d="M16 228V208" stroke="#00FF66" stroke-width="4" stroke-linecap="round"/>
  <path d="M228 240H208" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/>
  <path d="M240 228V208" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/>
  
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <radialGradient id="neon_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="60%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#030508" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paint1_linear" x1="31" y1="30" x2="226" y2="225" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#00FF66" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
</svg>
